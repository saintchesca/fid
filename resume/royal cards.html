<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Royal Cards</title>
<style>
body {
  background-color: #fffdf9;
  margin: 0 10%;
  font-family: sans-serif;
  text-align: center;
  }

h1 {
  color: #ff94a8;
  text-align: center;
  font: bold 1.75rem sans-serif;
  text-transform: uppercase;
  border-bottom: 5px solid #ffe5e5;
  margin-top: 30px;
}
a {
  color: #ff94a8;
  text-decoration: none;
  transition: opacity 0.3s ease;
}

a:hover {
  opacity: 0.5;
}
img {
  width: 100%; 
  max-width: 750px; 
  height: auto;
  border-radius: 8px;
}

.pyramid-top {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 30px;
}

.pyramid-bottom {
  display: flex;
  flex-direction: row;
  justify-content: center;
  gap: 40px;
  margin-bottom: 40px;
}

.card-item {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.card-item h2 {
  color: #ff94a8;
  font: bold 1.5rem sans-serif;
  text-transform: uppercase;
  margin-top: 0;
  margin-bottom: 15px;
}
p {
  color: #ff94a8;
  font: 1rem sans-serif;
  margin-top: 0;
  margin-bottom: 30px;
}
</style>
</head>

<body>
<h1>Royal Cards</h1>
<div class="pyramid-top">
    <div class="card-item">
      <h2>King Card</h2>
      <img src="../resume/images/photo/Royalecards2.png" alt="King Card">
    </div>
  </div>

  <div class="pyramid-bottom">
    <div class="card-item">
      <h2>Queen Card</h2>
      <img src="../resume/images/photo/Royalecards.png" alt="Queen Card">
    </div>

    <div class="card-item">
      <h2>Jack Card</h2>
      <img src="../resume/images/photo/Royalecards3.png" alt="Jack Card">
    </div>
  </div>
  <p>These will come in physical product and it will look different from these images.</p>
<a href="showcase.html">Back</a>
</body>
</html>

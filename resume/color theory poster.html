<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color Theory Poster</title>
<style>
body {
  background-color: #fffdf9;
  margin: 0 10%;
  font-family: sans-serif;
  text-align: center;
  }

h1 {
  color: #ff94a8;
  text-align: center;
  font: bold 1.75rem sans-serif;
  text-transform: uppercase;
  border-bottom: 5px solid #ffe5e5;
  margin-top: 30px;
}
a {
  color: #ff94a8;
  text-decoration: none;
  transition: opacity 0.3s ease;
}

a:hover {
  opacity: 0.5;
}
img { 
  width: 100%; 
  height:auto;
  }

h2 {
  color: #ff94a8;
  text-align: center;
  font: bold 1.75rem sans-serif;
  text-transform: uppercase;
  margin-top: 30px;
}
img { 
  width: 100%; 
  max-width: 380px; 
  height: auto;
  border-radius: 8px;
}

.main-poster {
  margin-bottom: 40px;
}

.grid-container {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 30px 20px;
  align-items: start;
  margin-bottom: 40px;
}

.grid-item {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.grid-item h2 {
  margin-top: 0;
}
</style>
</head>

<body>
<h1>Color Theory Poster</h1>
<div class="main-poster">
    <h2>Main</h2>
    <img src="../resume/images/photo/color theory.png" alt="Color Theory Poster">
  </div>

  <div class="grid-container">
    <div class="grid-item">
      <h2>Complementary</h2>
      <img src="../resume/images/photo/color theory 2.png" alt="Complementary Color Theory Poster">
    </div>

    <div class="grid-item">
      <h2>Triadic</h2>
      <img src="../resume/images/photo/color theory 3.png" alt="Triadic Color Theory Poster">
    </div>

    <div class="grid-item">
      <h2>Analogous</h2>
      <img src="../resume/images/photo/color theory 4.png" alt="Analogous Color Theory Poster">
    </div>

    <div class="grid-item">
      <h2>Monochromatic</h2>
      <img src="../resume/images/photo/color theory 5.png" alt="Monochromatic Color Theory Poster">
    </div>
  </div>
<a href="showcase.html">Back</a>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="Chesca Studio">
    <title>Chesca Studio</title>
    <link rel="stylesheet" href="https://use.typekit.net/sef1wwn.css">
    <style>
body {
    background-color: #ffe5e5;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
}
header {
    position: relative;
    background-color: #fffdf9;
    height: 215px;   
}
.logo {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 300px;
    height: auto;
}
.photo {
    position: absolute;
    right: 150px;
    bottom: -1px;
}
.hero {
    width: 220px;
    height: auto;
    display: block;
}
nav {
    position: absolute;
    left: 40px;
    top: 50%;
    transform: translateY(-50%);
}
nav ul {
    list-style: none;
    gap: 30px;
    margin: 0;
    padding: 0;
    display: flex;
}
nav ul li a {
    text-decoration: none;
    color: #ff94a8; 
    font: 1.2em sans-serif;
}
nav a:hover {
    opacity: 0.5;
}
h1 {
    color: #ff94a8;
    font: bold 1.25rem sans-serif;
    text-align: center;
}
h3 {
    font: 1.25rem sans-serif;
    text-align: center;
    color: #ff94a8;
}
p {
    font-family: "caflisch-script-pro", sans-serif;
    color: black;
    font-size: 25px;
}
footer {  
  text-align: center;
  margin-top: 2em;
  
} 
footer img {
  width: 40px;
  height: 40px;
} 
footer img:hover {
transform: scale(1.05);
}
ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
}
li {
  display: inline;
  margin: 0 15px;
}
</style>

<body>
<header>
<img src="../resume/images/logo/logo.png" alt="logo" class="logo">

<div class="photo">
  <img src="../resume/images/avatars/avatar3.png" alt="Girl" class="hero">
</div>

<nav>
    <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="https://chescastudio.shop">SHOP</a></li>
        <li><a href="showcase.html">GALLERY</a></li>
    </ul>
</nav>
</header>

<body>
<footer>
    <h1 style="font-size:30px;" style="text-align:center;">Follow Me On...</h1>
<ul>
    <li><img src="../resume/images/social icons/tiktok.svg" alt="tiktok"></li>
    <li><img src="../resume/images/social icons/Instagram.svg" alt="Instagram"></li>
    <li><img src="../resume/images/social icons/X.svg" alt="X" style="border-radius: 8px;"></li>
</ul>
    <h3 style="text-align:center;">Phone</h3>
    <p style="text-align:center;">000-000-0000</p>

    <h3 style="text-align:center;">Email</h3>
    <p style="text-align:center;">00000@gmail.com</p>
    
</footer>
</body>

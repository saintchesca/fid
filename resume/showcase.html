<head>

    <link rel="stylesheet" href="https://use.typekit.net/sef1wwn.css">
    <style>
body {
    background-color: #ffe5e5;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
}
    
header {
    position: relative;
    background-color: #fffdf9;
    height: 215px; 
}
.logo {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 300px;
    height: auto;
}
nav {
    position: absolute;
    left: 40px;
    top: 50%;
    transform: translateY(-50%);
}

nav ul {
    list-style: none;
    gap: 30px;
    margin: 0;
    padding: 0;
    display: flex;
}

nav ul li a {
    text-decoration: none;
    color: #ff94a8; 
    font: 1.2em sans-serif;
}

nav a:hover {
    opacity: 0.5;
}
.page-layout {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 150px;
    max-width: 1400px;
    margin: 120px auto 40px auto;
    padding: 0 20px;
    position: relative;
}
.avatar-container {
    position: relative;
    width: 350px;
    flex-shrink: 0;
}

.avatar {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0px 15px 8px #0000004d);
}
.avatar-container::after {
    content: "";
    position: absolute;
    bottom: -13px;
    left: 65%;
    transform: translateX(-50%);
    width: 100%;
    height: 100px;
    background: rgba(0, 0, 0, 0.147);
    border-radius: 50%;
    filter: blur(6px);
    z-index: -1;
}
.avatar-container::before {
    content: "";
    position: absolute;
    right: -100px;
    top: 100px;
    width: 5px;
    height: 100%;
    background-color: #ff94a8;
    border-radius: 2px;
}
h1 {
    color: #ff94a8;
    font: bold 1.75rem sans-serif;
    font-family: "Bebas Kai", sans-serif;
    text-transform: uppercase; 
    margin: 0;
    text-align: center;
    padding: 50px;
    top: 20%;
    transform: translateY(50%);
}
.right-container {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px

}
h2 {
    color: #ff94a8;
    font: bold 2rem "Bebas Kai", sans-serif;
    margin: 0;
    padding: 0;
    text-align: center;
}
.showcase-img {
    width: 100%;
    max-width: 180px;
    height: auto;
    border-radius: 10px;
    box-shadow: 0px 8px 12px rgba(0, 0, 0, 0.15); 
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    will-change: transform;
}
.image-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    width: 100%;
    justify-items: center;
}
.image-row img:hover {
    transform: scale(1.05);
    box-shadow: 0px 12px 18px rgba(0, 0, 0, 0.22);
}
.speech-bubble {
    position: absolute;
    top: -120px;
    left: 50%;
    margin-left: 150px;
    width: 150px;
    transform: translateX(-50%);
    text-align: center;
    background-color: #fffdf9;
    color: black;
    font-family: sans-serif;
    font-size: 1.5em;
    padding: 10px 15px;
    border-radius: 18px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
    z-index: 2;
}
.speech-bubble::after {
    content: "";
    position: absolute;
    bottom: -8px;
    left: 13%;
    transform: translateX(-50%);
    border-width: 8px 8px 0;
    border-style: solid;
    border-color: #fffdf9 transparent transparent;
}
.image-row li {
    list-style: none;
    margin: 0;
    padding: 0;
}
</style>
</head>
